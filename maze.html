<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maze Navigator</title>
<style>
  :root {
    --bg: #090d16;
    --card: #111726;
    --border: #1e293b;
    --text: #f8fafc;
    --wall: #cbd5e1;
    --path: #38bdf8;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* TOP BAR: THIN, CLEAN, HIGHEST PRIORITY TELEMETRY */
  #topBar {
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 8px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    z-index: 10;
    min-height: 72px;
  }

  .nav-group {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  /* HEADING & TIMER */
  .info-pill {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .info-pill .label {
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--wall);
    opacity: 0.7;
  }
  .info-pill .val {
    font-size: 1.15rem;
    font-weight: 800;
    color: var(--text);
    font-family: Consolas, monospace;
  }
  .timer-val {
    cursor: pointer;
  }
  .timer-val.running { color: var(--path); }
  .timer-val.over { color: var(--danger); animation: blink 0.8s infinite; }

  /* THREE BIG NUMBERS IN ONE ROW: LEFT | FRONT | RIGHT */
  .sensor-bar-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
    max-width: 580px;
  }

  .sensor-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    width: 100%;
    gap: 10px;
  }

  .sensor-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .sensor-box .name {
    font-size: 0.68rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    color: var(--wall);
    opacity: 0.75;
  }
  .sensor-box .num {
    font-family: Consolas, monospace;
    font-size: 1.45rem;
    font-weight: 900;
    color: var(--text);
    line-height: 1.2;
  }
  /* BUG 3 FIX: Red border and text only applies when front is blocked */
  .sensor-box.blocked {
    border-color: var(--danger);
  }
  .sensor-box.blocked .num {
    color: var(--danger);
  }
  .sensor-box .tag {
    font-size: 0.68rem;
    font-weight: 900;
    letter-spacing: 0.05em;
    margin-top: 2px;
    height: 14px;
    line-height: 14px;
  }
  .sensor-box.blocked .tag {
    color: var(--danger);
  }

  /* RAW ROW UNDER THE NUMBERS */
  .raw-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    font-family: Consolas, monospace;
    font-size: 0.72rem;
    color: var(--wall);
    opacity: 0.8;
    margin-top: 4px;
  }
  .raw-row.warning {
    color: var(--danger);
    font-weight: 700;
    opacity: 1;
  }

  /* CONTROLS ON TOP RIGHT */
  .toggle-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--wall);
    cursor: pointer;
    user-select: none;
  }
  .toggle-label input {
    cursor: pointer;
    accent-color: var(--path);
  }

  .btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .btn:hover {
    border-color: var(--path);
  }
  .btn.active {
    background: var(--path);
    color: var(--bg);
  }

  /* MAP CANVAS */
  #mapContainer {
    flex: 1;
    position: relative;
    background: var(--bg);
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* RECENT 3 TURNS STRIP AT BOTTOM */
  #recentTurnsBar {
    position: absolute;
    bottom: 12px;
    left: 16px;
    background: rgba(17, 23, 38, 0.9);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    display: flex;
    align-items: center;
    gap: 16px;
    font-family: Consolas, monospace;
    font-size: 0.78rem;
    color: var(--wall);
    pointer-events: none;
    z-index: 5;
  }
  #recentTurnsBar .title {
    font-weight: 800;
    color: var(--path);
    letter-spacing: 0.05em;
  }
  #recentTurnsBar .entry {
    color: var(--text);
  }

  /* DEAD END ALERT BANNER */
  #deadEndBanner {
    display: none;
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--danger);
    color: #fff;
    font-weight: 900;
    font-size: 1rem;
    padding: 6px 20px;
    border-radius: 6px;
    letter-spacing: 0.05em;
    animation: blink 0.7s infinite;
    z-index: 5;
    pointer-events: none;
  }

  /* COLLAPSIBLE SETTINGS PANEL (DRAWER) */
  #settingsDrawer {
    position: absolute;
    top: 73px;
    right: 0;
    bottom: 0;
    width: 340px;
    background: var(--card);
    border-left: 1px solid var(--border);
    transform: translateX(100%);
    transition: transform 0.2s ease-out;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    z-index: 20;
    overflow-y: auto;
  }
  #settingsDrawer.open {
    transform: translateX(0);
  }

  .drawer-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
  }
  .drawer-header h3 {
    font-size: 1rem;
    font-weight: 800;
  }

  .drawer-section {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .drawer-section label {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--wall);
    text-transform: uppercase;
  }

  .btn-danger {
    background: rgba(239, 68, 68, 0.2);
    border: 1px solid var(--danger);
    color: #fff;
    padding: 10px;
    border-radius: 6px;
    font-weight: 800;
    font-size: 0.85rem;
    cursor: pointer;
    text-align: center;
  }
  .btn-danger.active {
    background: var(--danger);
  }

  .log-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
    height: 140px;
    overflow-y: auto;
    font-family: Consolas, monospace;
    font-size: 0.75rem;
    color: var(--wall);
    white-space: pre-wrap;
    line-height: 1.4;
  }

  @keyframes blink { 50% { opacity: 0.35; } }
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topBar">
  <!-- LEFT: FACING, TIMER & MODE TOGGLE -->
  <div class="nav-group">
    <div class="info-pill">
      <div class="label">Heading</div>
      <div id="headingText" class="val">FACING NORTH</div>
    </div>
    <div class="info-pill">
      <div class="label">Timer [T]</div>
      <div id="clockDisplay" class="val timer-val">03:00</div>
    </div>
    <button id="btnMode" class="btn" title="Toggle STEP / HOLD mode (Press M)">MODE: STEP [M]</button>
  </div>

  <!-- CENTER: THE THREE BIG NUMBERS IN ONE ROW -->
  <div class="sensor-bar-container">
    <div class="sensor-row">
      <div id="boxSL" class="sensor-box">
        <div class="name">LEFT</div>
        <div id="valSL" class="num">—</div>
        <div id="tagSL" class="tag"></div>
      </div>
      <div id="boxSF" class="sensor-box">
        <div class="name">FRONT</div>
        <div id="valSF" class="num">—</div>
        <div id="tagSF" class="tag"></div>
      </div>
      <div id="boxSR" class="sensor-box">
        <div class="name">RIGHT</div>
        <div id="valSR" class="num">—</div>
        <div id="tagSR" class="tag"></div>
      </div>
    </div>
    <!-- RAW ECHO MICROSECONDS ROW UNDER THE NUMBERS -->
    <div id="rawEchoRow" class="raw-row">
      <span id="rawText">raw: — µs | — µs | — µs</span>
    </div>
  </div>

  <!-- RIGHT: DETAILS TOGGLE & SETTINGS BUTTON -->
  <div class="nav-group">
    <label class="toggle-label" title="Show graph nodes, edges and beams">
      <input type="checkbox" id="checkDetails"> Details
    </label>
    <button id="btnSettingsToggle" class="btn">Settings ⚙</button>
  </div>
</div>

<!-- MAP CONTAINER -->
<div id="mapContainer">
  <div id="deadEndBanner">⚠️ DEAD END DETECTED — REVERSE [S]</div>
  <canvas id="mapCanvas"></canvas>
  <!-- LAST 3 TURNS STRIP -->
  <div id="recentTurnsBar">
    <span class="title">LAST TURNS:</span>
    <span id="recentEntries" class="entry">None</span>
  </div>
</div>

<!-- COLLAPSIBLE SETTINGS PANEL (DRAWER) -->
<div id="settingsDrawer">
  <div class="drawer-header">
    <h3>Settings & Diagnostics</h3>
    <button id="btnCloseDrawer" class="btn">✕</button>
  </div>

  <!-- DIAGNOSTICS STATUS LINE -->
  <div class="drawer-section">
    <label>Diagnostics Status</label>
    <div id="diagStatus" style="font-family:Consolas,monospace; font-size:0.75rem; color:var(--wall); line-height:1.45; padding:8px; background:var(--bg); border:1px solid var(--border); border-radius:6px; white-space:pre-wrap;">Connecting...</div>
  </div>

  <div class="drawer-section">
    <label>Speed: <span id="speedVal">140</span> [Q/E]</label>
    <input type="range" id="speedSlider" min="40" max="255" value="140" style="accent-color:var(--path)">
  </div>

  <div class="drawer-section">
    <label>Manual Actions</label>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">
      <button id="btnResetMap" class="btn">Reset Map [R]</button>
      <button id="btnSpinCalib" class="btn">Spin Calib [K]</button>
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-top:4px;">
      <button id="btnTurnL" class="btn">↰ Left [J]</button>
      <button id="btnTurnU" class="btn">⮌ U-Turn [U]</button>
      <button id="btnTurnR" class="btn">↱ Right [L]</button>
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:4px;">
      <button id="btnNudgeMinus" class="btn" title="Turn calib -2% (Key [)">Turn -2% [ [ ]</button>
      <button id="btnNudgePlus" class="btn" title="Turn calib +2% (Key ])">Turn +2% [ ] ]</button>
    </div>
  </div>

  <button id="btnEstop" class="btn-danger">EMERGENCY BRAKE [Space hold]</button>

  <div class="drawer-section">
    <label>Full Turn Log</label>
    <div id="fullLogBox" class="log-box"></div>
  </div>
</div>

<script>
(function() {
  'use strict';

  var MATCH_MS = 3 * 60 * 1000;
  var WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/maze-ws';

  var $ = function(id) { return document.getElementById(id); };
  var canvas = $('mapCanvas');
  var ctx = canvas.getContext('2d');

  var ws = null;
  var speed = 140;
  var estop = false;
  var boostKey = false;
  var spaceHeld = false;
  var keyHeld = {};
  var currentMode = 'step'; // 'step' (default) or 'hold'
  var lastTelem = null;
  var gridCells = [];
  var gridMap = {};
  var lastBeams = [];
  var lastCar = [];
  var timer = { state: 'idle', startAt: 0 };
  var hasReceivedPacket = false;

  // Smooth car animation state
  var renderCarX = null;
  var renderCarY = null;
  var renderCarHeading = null;

  // ---- INTENT & DRIVING ----
  function readInput() {
    var thr = (keyHeld.w ? 1 : 0) - (keyHeld.s ? 1 : 0);
    var str = (keyHeld.d ? 1 : 0) - (keyHeld.a ? 1 : 0);
    return { thr: thr, str: str };
  }

  function wsReady() {
    return ws && ws.readyState === WebSocket.OPEN && ws.bufferedAmount < 4096;
  }

  function sendIntent() {
    if (!wsReady()) return;
    var inp = readInput();
    ws.send(JSON.stringify({
      type: 'intent',
      thr: inp.thr,
      str: inp.str,
      speed: speed,
      turn: 0,
      boost: boostKey,
      estop: estop,
      smooth: true,
      brake: true
    }));
  }

  function sendStepMotion(motion) {
    if (!wsReady()) return;
    ws.send(JSON.stringify({ type: 'stepMotion', motion: motion, speed: speed }));
  }

  function sendToggleMode() {
    if (!wsReady()) return;
    ws.send(JSON.stringify({ type: 'toggleMode' }));
  }

  function sendNudgeTurn(factor) {
    if (!wsReady()) return;
    ws.send(JSON.stringify({ type: 'nudgeTurnCalib', factor: factor }));
  }

  function sendTurn(action) {
    if (!wsReady()) return;
    ws.send(JSON.stringify({ type: 'manualTurn', action: action }));
  }

  // ---- WEBSOCKET CONNECTION ----
  function connect() {
    try {
      ws = new WebSocket(WS_URL);
    } catch (_) {
      setTimeout(connect, 2000);
      return;
    }

    ws.onopen = function() {
      if (currentMode === 'hold') sendIntent();
    };

    ws.onmessage = function(ev) {
      var m;
      try { m = JSON.parse(ev.data); } catch (_) { return; }
      if (!m) return;
      hasReceivedPacket = true;

      if (m.type === 'telem') {
        lastTelem = m.telem;
        lastBeams = m.beams || [];
        lastCar = m.car || [];
        if (m.gridDelta && m.gridDelta.length > 0) mergeGrid(m.gridDelta);
        updateUI();
      } else if (m.type === 'fullState') {
        lastTelem = m.telem;
        lastBeams = m.beams || [];
        lastCar = m.car || [];
        gridCells = m.gridCells || [];
        rebuildGrid();
        updateUI();
      }
    };

    ws.onclose = function() {
      setTimeout(connect, 2000);
    };
    ws.onerror = function() {};
  }

  function rebuildGrid() {
    gridMap = {};
    for (var i = 0; i < gridCells.length; i++) {
      var c = gridCells[i];
      gridMap[c.x + ',' + c.y] = c.v;
    }
  }

  function mergeGrid(delta) {
    for (var i = 0; i < delta.length; i++) {
      var c = delta[i];
      gridMap[c.x + ',' + c.y] = c.v;
    }
  }

  // ---- UI UPDATES (PART 3) ----
  function updateUI() {
    var t = lastTelem;
    if (!t) return;

    if (t.mode) {
      currentMode = t.mode;
      $('btnMode').textContent = 'MODE: ' + t.mode.toUpperCase() + ' [M]';
    }

    // Heading in simple format: "FACING NORTH"
    $('headingText').textContent = 'FACING ' + t.headingName;

    // The 3 Big Numbers (BUG 3 FIX: red blocked applies ONLY to FRONT box)
    renderSensorBox('SL', t.distL, false);
    renderSensorBox('SF', t.distF, t.frontBlocked || (t.distF !== null && t.distF < 12));
    renderSensorBox('SR', t.distR, false);

    // Raw echo microseconds row under numbers
    var rawEl = $('rawEchoRow');
    var rawTextEl = $('rawText');
    if (hasReceivedPacket && t.rawF === 0) {
      rawEl.className = 'raw-row warning';
      rawTextEl.textContent = 'front sensor: no signal, check wiring (raw: ' + t.rawL + ' µs | 0 µs | ' + t.rawR + ' µs)';
    } else {
      rawEl.className = 'raw-row';
      rawTextEl.textContent = 'raw: ' + t.rawL + ' µs | ' + t.rawF + ' µs | ' + t.rawR + ' µs';
    }

    // Diagnostics status line
    var stat = t.frontEchoStat || { pct: 0, lastRawF: 0 };
    $('diagStatus').textContent =
      'PWM: [' + t.pwmL + ', ' + t.pwmR + '] | Pos: (' + t.x.toFixed(1) + ', ' + t.y.toFixed(1) + ') | ' +
      'Heading: ' + t.heading.toFixed(1) + '°\n' +
      'vFull: ' + t.vFull + ' cm/s | spinDegS: ' + t.spinDegS + '°/s\n' +
      'Mode: ' + (t.mode || 'step').toUpperCase() + ' | Step: ' + (t.currentStep || 'IDLE') + '\n' +
      'Front Echoes (2s): ' + stat.pct + '% (last: ' + stat.lastRawF + ' µs)';

    // Dead end banner
    $('deadEndBanner').style.display = (t.distF !== null && t.distF < 16 && t.distL !== null && t.distL < 40 && t.distR !== null && t.distR < 40) ? 'block' : 'none';

    // Turn log updates
    if (t.turnLog) {
      // Recent 3 turns for bottom strip
      var recent = t.turnLog.slice(-3);
      if (recent.length > 0) {
        var strList = recent.map(function(e) { return '[' + e.time + '] ' + e.text; });
        $('recentEntries').textContent = strList.join('   •   ');
      } else {
        $('recentEntries').textContent = 'None';
      }

      // Full turn log in drawer
      var fullLines = t.turnLog.map(function(e) { return e.time + '  ' + e.text; });
      var box = $('fullLogBox');
      box.textContent = fullLines.join('\n');
      box.scrollTop = box.scrollHeight;
    }

    // Spin calib button
    $('btnSpinCalib').textContent = t.spinCalibActive ? 'Spin 360° ▶ [K]' : 'Spin Calib [K]';
    $('btnSpinCalib').classList.toggle('active', !!t.spinCalibActive);
  }

  // BUG 3 FIX: Only FRONT box can get red styling and BLOCKED tag
  function renderSensorBox(id, dist, isBlocked) {
    var box = $('box' + id);
    var numEl = $('val' + id);
    var tagEl = $('tag' + id);

    if (dist === null || dist === undefined) {
      box.className = 'sensor-box';
      numEl.textContent = '>100';
      tagEl.textContent = '';
    } else if (id === 'SF' && (dist < 12 || isBlocked)) {
      // Front box only: show the number in red with the word BLOCKED under it
      box.className = 'sensor-box blocked';
      numEl.textContent = dist.toFixed(1) + ' cm';
      tagEl.textContent = 'BLOCKED';
    } else {
      // Left and right boxes just show their number without red or BLOCKED
      box.className = 'sensor-box';
      numEl.textContent = dist.toFixed(1) + ' cm';
      tagEl.textContent = '';
    }
  }

  // ---- TIMER ----
  function updateClock() {
    var el = $('clockDisplay');
    if (timer.state === 'run') {
      var left = MATCH_MS - (Date.now() - timer.startAt);
      if (left <= 0) {
        timer.state = 'done';
        el.className = 'val timer-val over';
        el.textContent = '00:00';
      } else {
        el.className = 'val timer-val running';
        el.textContent = fmtMs(left);
      }
    } else if (timer.state === 'done') {
      el.className = 'val timer-val over';
      el.textContent = '00:00';
    } else {
      el.className = 'val timer-val';
      el.textContent = '03:00';
    }
  }

  function fmtMs(ms) {
    var s = Math.ceil(ms / 1000);
    var m = Math.floor(s / 60);
    var sec = s % 60;
    return (m < 10 ? '0' : '') + m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function toggleTimer() {
    if (timer.state === 'idle') {
      timer.state = 'run';
      timer.startAt = Date.now();
      if (wsReady()) ws.send(JSON.stringify({ type: 'timer', action: 'start' }));
    } else {
      timer.state = 'idle';
      if (wsReady()) ws.send(JSON.stringify({ type: 'timer', action: 'stop' }));
    }
    updateClock();
  }

  // ---- MAP RENDERING (AT MOST 4 COLORS) ----
  var dpr = window.devicePixelRatio || 1;

  function resizeCanvas() {
    var container = $('mapContainer');
    if (canvas.width !== container.clientWidth * dpr || canvas.height !== container.clientHeight * dpr) {
      canvas.width = container.clientWidth * dpr;
      canvas.height = container.clientHeight * dpr;
    }
  }

  function renderMap() {
    resizeCanvas();
    var w = canvas.width, h = canvas.height;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#090d16';
    ctx.fillRect(0, 0, w, h);

    var t = lastTelem;
    if (!t) return;

    // Smooth car animation interpolation
    if (renderCarX === null) {
      renderCarX = t.x;
      renderCarY = t.y;
      renderCarHeading = t.heading;
    } else {
      renderCarX += (t.x - renderCarX) * 0.35;
      renderCarY += (t.y - renderCarY) * 0.35;
      var dHeading = ((t.heading - renderCarHeading + 540) % 360) - 180;
      renderCarHeading = (renderCarHeading + dHeading * 0.35 + 360) % 360;
    }

    var showDetails = $('checkDetails').checked;

    // Bounds auto-fitting
    var minX = t.x - 40, maxX = t.x + 40, minY = t.y - 40, maxY = t.y + 40;
    if (t.trail) {
      for (var i = 0; i < t.trail.length; i++) {
        var pt = t.trail[i];
        if (pt.x < minX) minX = pt.x; if (pt.x > maxX) maxX = pt.x;
        if (pt.y < minY) minY = pt.y; if (pt.y > maxY) maxY = pt.y;
      }
    }
    for (var key in gridMap) {
      if (gridMap[key] > 0.4) {
        var p = key.split(',');
        var gx = parseFloat(p[0]), gy = parseFloat(p[1]);
        if (gx < minX) minX = gx; if (gx > maxX) maxX = gx;
        if (gy < minY) minY = gy; if (gy > maxY) maxY = gy;
      }
    }

    minX -= 15; maxX += 15; minY -= 15; maxY += 15;
    var rangeX = maxX - minX || 1, rangeY = maxY - minY || 1;
    var scale = Math.min(w / rangeX, h / rangeY) * 0.92;
    var cx = w / 2, cy = h / 2;
    var midX = (minX + maxX) / 2, midY = (minY + maxY) / 2;

    function wx(x) { return cx + (x - midX) * scale; }
    function wy(y) { return cy - (y - midY) * scale; }

    // 1. WALLS (WALL COLOUR)
    var cellSize = Math.max(2 * dpr, 2.2 * scale);
    ctx.fillStyle = '#cbd5e1';
    for (var k in gridMap) {
      if (gridMap[k] > 0.3) {
        var parts = k.split(',');
        var px = parseFloat(parts[0]), py = parseFloat(parts[1]);
        ctx.fillRect(wx(px) - cellSize / 2, wy(py) - cellSize / 2, cellSize, cellSize);
      }
    }

    // 2. PATH LINE (PATH COLOUR)
    if (t.trail && t.trail.length > 1) {
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 3 * dpr;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(wx(t.trail[0].x), wy(t.trail[0].y));
      for (var j = 1; j < t.trail.length; j++) {
        ctx.lineTo(wx(t.trail[j].x), wy(t.trail[j].y));
      }
      ctx.stroke();
    }

    // 3. DETAILS: GRAPH NODES, EDGES, SENSOR BEAMS (Hidden by default)
    if (showDetails) {
      if (t.edges && t.nodes) {
        var nodeMap = {};
        for (var n = 0; n < t.nodes.length; n++) nodeMap[t.nodes[n].id] = t.nodes[n];
        ctx.strokeStyle = 'rgba(203, 213, 225, 0.4)';
        ctx.lineWidth = 1.5 * dpr;
        for (var e = 0; e < t.edges.length; e++) {
          var n1 = nodeMap[t.edges[e].from];
          var n2 = nodeMap[t.edges[e].to];
          if (n1 && n2) {
            ctx.beginPath();
            ctx.moveTo(wx(n1.x), wy(n1.y));
            ctx.lineTo(wx(n2.x), wy(n2.y));
            ctx.stroke();
          }
        }
      }

      if (lastBeams) {
        ctx.lineWidth = 1 * dpr;
        for (var b = 0; b < lastBeams.length; b++) {
          var beam = lastBeams[b];
          ctx.strokeStyle = beam.hit ? 'rgba(203, 213, 225, 0.6)' : 'rgba(56, 189, 248, 0.3)';
          ctx.beginPath();
          ctx.moveTo(wx(beam.sx), wy(beam.sy));
          ctx.lineTo(wx(beam.ex), wy(beam.ey));
          ctx.stroke();
        }
      }
    }

    // 4. JUNCTION & UNEXPLORED-OPENING MARKERS
    if (t.nodes) {
      for (var ni = 0; ni < t.nodes.length; ni++) {
        var node = t.nodes[ni];
        if (node.isJunction) {
          ctx.fillStyle = '#38bdf8';
          ctx.beginPath();
          ctx.arc(wx(node.x), wy(node.y), 4 * dpr, 0, Math.PI * 2);
          ctx.fill();

          if (node.turnArrowHeading !== undefined) {
            var thRad = node.turnArrowHeading * Math.PI / 180;
            var arrowLen = 12 * dpr;
            var tax = wx(node.x) + Math.sin(thRad) * arrowLen;
            var tay = wy(node.y) - Math.cos(thRad) * arrowLen;
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 2 * dpr;
            ctx.beginPath();
            ctx.moveTo(wx(node.x), wy(node.y));
            ctx.lineTo(tax, tay);
            ctx.stroke();
          }
        } else if (node.isDeadEnd) {
          ctx.fillStyle = '#ef4444';
          ctx.beginPath();
          ctx.arc(wx(node.x), wy(node.y), 4 * dpr, 0, Math.PI * 2);
          ctx.fill();
        } else if (showDetails) {
          ctx.fillStyle = '#38bdf8';
          ctx.beginPath();
          ctx.arc(wx(node.x), wy(node.y), 2.5 * dpr, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    if (t.openings) {
      for (var oi = 0; oi < t.openings.length; oi++) {
        var op = t.openings[oi];
        if (!op.entered) {
          ctx.fillStyle = '#38bdf8';
          ctx.beginPath();
          ctx.arc(wx(op.x), wy(op.y), 4.5 * dpr, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    // 5. ROBOT CAR WITH FRONT ARROW (Smoothly Animated)
    var animX = renderCarX !== null ? renderCarX : t.x;
    var animY = renderCarY !== null ? renderCarY : t.y;
    var animHeading = renderCarHeading !== null ? renderCarHeading : t.heading;
    var headRad = animHeading * Math.PI / 180;

    var hw = 7.0; // half width (14 cm)
    var hl = 8.0; // half length (16 cm)
    var corners = [
      { cx: -hw, cy:  hl },
      { cx:  hw, cy:  hl },
      { cx:  hw, cy: -hl },
      { cx: -hw, cy: -hl }
    ];
    var worldCorners = corners.map(function(c) {
      return {
        x: animX + c.cx * Math.cos(headRad) + c.cy * Math.sin(headRad),
        y: animY - c.cx * Math.sin(headRad) + c.cy * Math.cos(headRad)
      };
    });

    ctx.beginPath();
    ctx.moveTo(wx(worldCorners[0].x), wy(worldCorners[0].y));
    for (var c = 1; c < 4; c++) ctx.lineTo(wx(worldCorners[c].x), wy(worldCorners[c].y));
    ctx.closePath();
    ctx.fillStyle = '#111726';
    ctx.fill();
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 2 * dpr;
    ctx.stroke();

    // Heading Arrow on car (RED)
    var aLen = Math.max(16 * dpr, 14 * scale);
    var ax = wx(animX) + Math.sin(headRad) * aLen;
    var ay = wy(animY) - Math.cos(headRad) * aLen;

    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 3 * dpr;
    ctx.beginPath();
    ctx.moveTo(wx(animX), wy(animY));
    ctx.lineTo(ax, ay);
    ctx.stroke();

    var aSize = 6 * dpr;
    var aAngle = Math.atan2(ay - wy(animY), ax - wx(animX));
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(ax - aSize * Math.cos(aAngle - 0.5), ay - aSize * Math.sin(aAngle - 0.5));
    ctx.lineTo(ax - aSize * Math.cos(aAngle + 0.5), ay - aSize * Math.sin(aAngle + 0.5));
    ctx.closePath();
    ctx.fillStyle = '#ef4444';
    ctx.fill();

    // 6. RED WALL SEGMENT AHEAD OF CAR IF FRONT BLOCKED
    if ((t.frontBlocked || (t.distF !== null && t.distF < 12)) && t.distF !== null) {
      var dBlocked = Math.max(2.5, t.distF);
      var fsx = animX + 8.0 * Math.sin(headRad);
      var fsy = animY + 8.0 * Math.cos(headRad);
      var wallCenterWorldX = fsx + Math.sin(headRad) * dBlocked;
      var wallCenterWorldY = fsy + Math.cos(headRad) * dBlocked;

      var halfSeg = 12;
      var perpX = Math.cos(headRad) * halfSeg;
      var perpY = -Math.sin(headRad) * halfSeg;

      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 4 * dpr;
      ctx.beginPath();
      ctx.moveTo(wx(wallCenterWorldX - perpX), wy(wallCenterWorldY - perpY));
      ctx.lineTo(wx(wallCenterWorldX + perpX), wy(wallCenterWorldY + perpY));
      ctx.stroke();
    }
  }

  // ---- KEYBOARD CONTROLS ----
  var WASD = { KeyW: 'w', KeyS: 's', KeyA: 'a', KeyD: 'd' };

  window.addEventListener('keydown', function(e) {
    if (e.code === 'Space') {
      e.preventDefault();
      spaceHeld = true;
      estop = true;
      $('btnEstop').classList.add('active');
      sendIntent();
      return;
    }

    if (e.ctrlKey || e.metaKey || e.altKey) return;

    // Key M toggles between STEP and HOLD mode
    if (e.code === 'KeyM') {
      e.preventDefault();
      sendToggleMode();
      return;
    }

    // Keys [ and ] nudge 90-degree turn calibration by -/+ 2%
    if (e.code === 'BracketLeft') {
      e.preventDefault();
      sendNudgeTurn(0.98);
      return;
    }
    if (e.code === 'BracketRight') {
      e.preventDefault();
      sendNudgeTurn(1.02);
      return;
    }

    // In STEP mode: W, A, S, D run fixed motion
    if (currentMode === 'step') {
      if (e.repeat) return;
      if (e.code === 'KeyW') { e.preventDefault(); sendStepMotion('W'); return; }
      if (e.code === 'KeyA') { e.preventDefault(); sendStepMotion('A'); return; }
      if (e.code === 'KeyD') { e.preventDefault(); sendStepMotion('D'); return; }
      if (e.code === 'KeyS') { e.preventDefault(); sendStepMotion('S'); return; }
    } else {
      // In HOLD mode: continuous driving
      var dir = WASD[e.code];
      if (dir) {
        e.preventDefault();
        if (!keyHeld[dir]) { keyHeld[dir] = true; sendIntent(); }
        return;
      }
    }

    if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
      boostKey = true; sendIntent(); return;
    }

    if (e.repeat) return;

    switch (e.code) {
      case 'KeyJ':
      case 'ArrowLeft':
        e.preventDefault();
        sendTurn('left');
        break;
      case 'KeyL':
      case 'ArrowRight':
        e.preventDefault();
        sendTurn('right');
        break;
      case 'KeyU':
      case 'KeyB':
      case 'ArrowDown':
        e.preventDefault();
        sendTurn('uturn');
        break;
      case 'Digit1':
      case 'Numpad1':
        sendTurn('north');
        break;
      case 'Digit2':
      case 'Numpad2':
        sendTurn('east');
        break;
      case 'Digit3':
      case 'Numpad3':
        sendTurn('south');
        break;
      case 'Digit4':
      case 'Numpad4':
        sendTurn('west');
        break;
      case 'KeyT':
        e.preventDefault();
        toggleTimer();
        break;
      case 'KeyR':
        if (wsReady()) ws.send(JSON.stringify({ type: 'reset' }));
        break;
      case 'KeyK':
        if (wsReady()) ws.send(JSON.stringify({ type: 'spinCalib' }));
        break;
      case 'KeyQ':
        speed = Math.max(40, speed - 15);
        $('speedSlider').value = speed;
        $('speedVal').textContent = speed;
        if (currentMode === 'hold') sendIntent();
        break;
      case 'KeyE':
        speed = Math.min(255, speed + 15);
        $('speedSlider').value = speed;
        $('speedVal').textContent = speed;
        if (currentMode === 'hold') sendIntent();
        break;
      case 'Escape':
        $('settingsDrawer').classList.remove('open');
        break;
    }
  });

  window.addEventListener('keyup', function(e) {
    if (currentMode === 'hold') {
      var dir = WASD[e.code];
      if (dir) { keyHeld[dir] = false; sendIntent(); return; }
    }
    if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') { boostKey = false; sendIntent(); return; }
    if (e.code === 'Space') {
      e.preventDefault();
      spaceHeld = false;
      estop = false;
      $('btnEstop').classList.remove('active');
      sendIntent();
    }
  });

  window.addEventListener('blur', function() {
    keyHeld = {}; boostKey = false; spaceHeld = false; estop = false;
    $('btnEstop').classList.remove('active');
    if (currentMode === 'hold') sendIntent();
  });

  // ---- UI BUTTON CLICKS & DRAWER ----
  $('btnMode').addEventListener('click', sendToggleMode);
  $('clockDisplay').addEventListener('click', toggleTimer);
  $('btnSettingsToggle').addEventListener('click', function() {
    $('settingsDrawer').classList.toggle('open');
  });
  $('btnCloseDrawer').addEventListener('click', function() {
    $('settingsDrawer').classList.remove('open');
  });
  $('btnResetMap').addEventListener('click', function() {
    if (wsReady()) ws.send(JSON.stringify({ type: 'reset' }));
  });
  $('btnSpinCalib').addEventListener('click', function() {
    if (wsReady()) ws.send(JSON.stringify({ type: 'spinCalib' }));
  });
  $('btnTurnL').addEventListener('click', function() { sendTurn('left'); });
  $('btnTurnR').addEventListener('click', function() { sendTurn('right'); });
  $('btnTurnU').addEventListener('click', function() { sendTurn('uturn'); });
  $('btnNudgeMinus').addEventListener('click', function() { sendNudgeTurn(0.98); });
  $('btnNudgePlus').addEventListener('click', function() { sendNudgeTurn(1.02); });

  $('speedSlider').addEventListener('input', function(e) {
    speed = parseInt(e.target.value, 10);
    $('speedVal').textContent = speed;
    if (currentMode === 'hold') sendIntent();
  });

  $('btnEstop').addEventListener('mousedown', function() {
    estop = true; $('btnEstop').classList.add('active'); sendIntent();
  });
  window.addEventListener('mouseup', function() {
    if (!spaceHeld && estop) {
      estop = false; $('btnEstop').classList.remove('active'); sendIntent();
    }
  });

  // Loops
  setInterval(function() {
    if (currentMode === 'hold') sendIntent();
    updateClock();
  }, 40);

  function loop() {
    renderMap();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  connect();
})();
</script>
</body>
</html>
